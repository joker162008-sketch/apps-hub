<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Daily practice · Cantonese Coach</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">廣東話 Coach</a>
  <nav>
    <a href="daily.html" aria-current="page">每日 Daily</a>
    <a href="dialogues.html">對話 Dialogues</a>
    <a href="bank.html">句庫 Bank</a>
  </nav>
</header>
<main>
<h1>每日十句 <small class="muted">Daily 10 · <span id="today-label"></span></small></h1>
<section id="voice"></section>
<section id="stats"></section>
<section class="controls sticky">
  <button class="btn" id="play-all" type="button">▶ Read-along</button>
  <button class="btn good" id="repeat-mode" type="button">🎙 Repeat after me</button>
  <label class="inline">× <select id="repeats" aria-label="Repeats per sentence"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
  <button class="btn warn" id="stop" type="button">■ Stop</button>
  <span id="run-status" class="muted" aria-live="polite"></span>
</section>
<section id="daily-list"></section>
</main>
<footer class="foot muted">Practice tool. Audio uses your browser's built-in Cantonese voice (Web Speech API). Progress is stored only in this browser.</footer>
<script src="data/categories.js"></script>
<script src="data/sentences.js"></script>
<script src="data/dialogues.js"></script>
<script src="js/store.js"></script>
<script src="js/speech.js"></script>
<script src="js/ui.js"></script>
<script src="js/daily.js"></script>
</body>
</html>
